name: integrations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: diagno_xpert/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: diagno_xpert

      - name: Disable Next.js telemetry
        run: npx next telemetry disable
        working-directory: diagno_xpert

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: diagno_xpert/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.node-version }}-${{ hashFiles('diagno_xpert/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.node-version }}-

      - name: Build project
        run: npm run build
        working-directory: diagno_xpert
